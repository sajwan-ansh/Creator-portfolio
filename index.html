<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Ansh — Animator, Illustrator & Visual Creator Portfolio</title>
    <meta name="title" content="Ansh — Animator, Illustrator & Visual Creator Portfolio" />
    <meta name="description" content="Personalized creative portfolio showcasing 2D/3D animation, video editing, photography, 3D asset modeling, and digital artworks by Ansh." />
    <meta name="author" content="Ansh" />
    <meta name="keywords" content="Animator, Illustrator, Visual Creator, 2D Animation, 3D Animation, Video Editing, Photography, Concept Art, Portfolio" />

    <!-- Open Graph / Facebook / LinkedIn Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ansh-portfolio.vercel.app" />
    <meta property="og:title" content="Ansh — Animator, Illustrator & Visual Creator Portfolio" />
    <meta property="og:description" content="Personalized creative portfolio showcasing 2D/3D animation, video editing, photography, 3D modeling, and digital artworks." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1200&q=80" />

    <!-- Twitter Card Meta Tags -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Ansh — Animator, Illustrator & Visual Creator Portfolio" />
    <meta property="twitter:description" content="Personalized creative portfolio showcasing 2D/3D animation, video editing, photography, 3D modeling, and digital artworks." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1200&q=80" />

    <!-- Google Fonts Preconnect & Display Swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Structured Data JSON-LD for Creator Profile -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ansh",
        "jobTitle": "Animator, Illustrator & Visual Creator",
        "url": "https://ansh-portfolio.vercel.app",
        "sameAs": [
          "https://instagram.com",
          "https://youtube.com",
          "https://artstation.com",
          "https://behance.net"
        ]
      }
    </script>
  </head>
  <body class="bg-[#f7f6f2] text-[#1c1c1e] font-sans antialiased selection:bg-stone-900 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
